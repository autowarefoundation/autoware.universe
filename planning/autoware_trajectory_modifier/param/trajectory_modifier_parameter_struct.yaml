        type: double
        default_value: 5.0
        description: Extra terminal weight along the goal heading, latched near the route goal [1/m^2]
        validation:
          bounds<>: [0.0, 10000.0]
        read_only: false
      weight_lateral:
        type: double
        default_value: 5.0
        description: Extra terminal weight perpendicular to the goal heading [1/m^2]
        validation:
          bounds<>: [0.0, 10000.0]
        read_only: false
      weight_yaw:
        type: double
        default_value: 0.5
        description: Extra terminal heading weight toward the route goal [1/rad^2]
        validation:
          bounds<>: [0.0, 10000.0]
        read_only: false
      weight_velocity:
        type: double
        default_value: 0.1
        description: Extra terminal weight pulling velocity to zero at the route goal
        validation:
          bounds<>: [0.0, 10000.0]
        read_only: false
      snap_distance_m:
        type: double
        default_value: 1.0
        description: Latch the goal terminal penalty once the predicted endpoint is within this distance of the route goal [m]
        validation:
          bounds<>: [0.0, 10000.0]
        read_only: false
      unlatch_horizon_s:
        type: double
        default_value: 8.0
        description: Unlatch goal snap when ego-to-goal exceeds this horizon times speed. <= 0 disables the check [s]
        read_only: false
