trajectory_modifier_params:
  plugin_names:
    type: string_array
    default_value:
      - autoware::trajectory_modifier::plugin::TrajectoryTimeSequenceRawOptimizer
      - autoware::trajectory_modifier::plugin::ModelPlanningFactorID
      - autoware::trajectory_modifier::plugin::ExternalVelocityLimit
      - autoware::trajectory_modifier::plugin::MapVelocityLimits
      - autoware::trajectory_modifier::plugin::StopPointFixer
      - autoware::trajectory_modifier::plugin::SurroundObstacleStop
      - autoware::trajectory_modifier::plugin::ObstacleStop
      - autoware::trajectory_modifier::plugin::TrafficLightStop
      - autoware::trajectory_modifier::plugin::VelocityModifier
      - autoware::trajectory_modifier::plugin::TrajectoryTemporalMPTOptimizer
      - autoware::trajectory_modifier::plugin::TrajectoryPointFixer
      - autoware::trajectory_modifier::plugin::TrajectoryKinematicFeasibilityEnforcer
      - autoware::trajectory_modifier::plugin::TrajectoryQPSmoother
      - autoware::trajectory_modifier::plugin::TrajectoryKinematicFeasibilityEnforcer
      - autoware::trajectory_modifier::plugin::TrajectoryVelocityOptimizer
      - autoware::trajectory_modifier::plugin::TrajectoryEBSmootherOptimizer
      - autoware::trajectory_modifier::plugin::TrajectorySplineSmoother
      - autoware::trajectory_modifier::plugin::TrajectoryMPTOptimizer
      - autoware::trajectory_modifier::plugin::TrajectoryExtender
    description: Ordered list of trajectory processor plugin class names
    read_only: false
  use_map_velocity_limits:
    type: bool
    default_value: true
    description: Enable the use of map velocity limits
    read_only: false
  use_external_velocity_limit:
    type: bool
    default_value: true
    description: Enable the use of the external velocity limit
    read_only: false
  use_stop_point_fixer:
    type: bool
    default_value: true
    description: Enable the use of stop point fixer
    read_only: false
  use_obstacle_stop:
    type: bool
    default_value: true
    description: Enable the use of obstacle stop
    read_only: false
  use_velocity_modifier:
    type: bool
    default_value: true
    description: Enable the use of velocity modifier
    read_only: false
  use_surround_obstacle_stop:
    type: bool
    default_value: true
    description: Enable the use of surround obstacle stop
    read_only: false
  use_traffic_light_stop:
    type: bool
    default_value: false
    description: Enable the use of traffic light stop
    read_only: false
  use_model_planning_factor_id:
    type: bool
    default_value: true
    description: Enable ModelPlanningFactorID (publishes module diffusion_planner)
    read_only: false
  trajectory_time_step:
    type: double
    default_value: 0.1
    description: Time step for trajectory modification [s]
    read_only: false
    validation:
      bounds<>: [0.05, 1.0]

  stop_point_fixer:
    force_stop_long_stopped_trajectories:
      type: bool
      default_value: true
      description: Force zero velocity trajectory for trajectories with long stops
      read_only: false
    force_stop_close_stopped_trajectories:
      type: bool
      default_value: true
      description: Force zero velocity trajectory for trajectories with stops close to ego
      read_only: false
    velocity_threshold:
      type: double
      default_value: 0.25
      description: Velocity threshold below which ego vehicle is considered stationary [m/s]
      read_only: false
      validation:
        bounds<>: [0.0, 100.0]
    min_distance_threshold:
      type: double
      default_value: 1.0
      description: Minimum distance threshold to trigger trajectory replacement [m]
      read_only: false
      validation:
        bounds<>: [0.0, 100.0]
    min_stop_duration:
      type: double
      default_value: 0.5
      description: Minimum duration of stop to trigger trajectory replacement [s]
      read_only: false
      validation:
        bounds<>: [0.0, 10.0]

  stopping_constraints:
    nominal_deceleration:
      type: double
      default_value: 1.0
      description: Nominal deceleration during stopping [m/s^2]
      read_only: false
      validation:
        bounds<>: [0.0, 10.0]
    maximum_deceleration:
      type: double
      default_value: 4.0
      description: Maximum deceleration during stopping [m/s^2]
      read_only: false
      validation:
        bounds<>: [0.0, 10.0]
    jerk_limit:
      type: double
      default_value: 3.0
      description: Jerk limit during stopping [m/s^3]
      read_only: false
      validation:
        bounds<>: [0.0, 10.0]
    delay_response_time:
      type: double
      default_value: 0.5
      description: Delay response time used to estimate the minimum ego stopping distance [s]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    arrived_distance_threshold:
      type: double
      default_value: 0.5
      description: Threshold to check if the ego vehicle has arrived at the stop point [m]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    ego_stopped_vel_th:
      type: double
      default_value: 0.1
      description: Velocity threshold below which ego is considered stopped [m/s]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false

  obstacle_stop:
    use_objects:
      type: bool
      default_value: true
      description: Enable the use of objects for obstacle stop
      read_only: false
    use_pointcloud:
      type: bool
      default_value: true
      description: Enable the use of pointcloud for obstacle stop
      read_only: false
    enable_stop_for_objects:
      type: bool
      default_value: true
      description: Enable stopping behavior when object is detected as obstacle
      read_only: false
    enable_stop_for_pointcloud:
      type: bool
      default_value: false
      description: Enable stopping behavior when pointcloud is detected as obstacle
      read_only: false
    stop_margin:
      type: double
      default_value: 6.0
      description: Distance to maintain from an obstacle when stopped [m]
      validation:
        bounds<>: [0.0, 100.0]
      read_only: false
    minimum_stop_margin:
      type: double
      default_value: 3.0
      description: Minimum distance to maintain from an obstacle when stopped [m]
      validation:
        bounds<>: [0.0, 100.0]
      read_only: false
    duplicate_check_threshold:
      type: double
      default_value: 0.5
      description: Threshold to check if the stop point is already in the trajectory [m]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false

    obstacle_tracking:
      on_time_buffer:
        type: double
        default_value: 0.5
        description: Continuous detection duration to consider object/pointcloud to be persistent [s]
        validation:
          bounds<>: [0.0, 5.0]
        read_only: false
      off_time_buffer:
        type: double
        default_value: 1.0
        description: Continuous non-detection duration to consider object/pointcloud as not persistent [s]
        validation:
          bounds<>: [0.0, 5.0]
        read_only: false
      object_distance_th:
        type: double
        default_value: 1.0
        description: Distance threshold for object tracking [m]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
      object_yaw_th:
        type: double
        default_value: 0.1745
        description: Yaw threshold for object tracking [rad]
        validation:
          bounds<>: [0.0, 3.14]
        read_only: false
      pcd_distance_th:
        type: double
        default_value: 1.0
        description: Distance threshold for pointcloud tracking [m]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
      grace_period:
        type: double
        default_value: 0.2
        description: Grace period for object tracking [s]
        validation:
          bounds<>: [0.0, 1.0]
        read_only: false

    objects:
      target_objects:
        bbox:
          type: string_array
          default_value:
            [car, truck, bus, trailer, motorcycle, bicycle, pedestrian, hazard, unknown]
          description: Types of bounding box shaped objects to consider for obstacle stop
          read_only: false
        polygon:
          type: string_array
          default_value: [car, truck, bus, trailer, pedestrian, hazard, unknown]
          description: Types of polygon shaped objects to consider for obstacle stop
          read_only: false
        pointcloud:
          type: string_array
          default_value: [structure, vegetation]
          description: Types of pointcloud to consider for obstacle stop
          read_only: false
      stopped_velocity_th:
        type: double
        default_value: 0.25
        description: Velocity threshold for target object to be considered as stopped [m/s]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
      max_lateral_velocity_th:
        type: double
        default_value: 1.0
        description: Maximum lateral velocity threshold for target object to be considered for obstacle stop [m/s]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
      safety_buffer:
        type: double
        default_value: 0.0
        description: Safety buffer to expand object shape [m]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
      pointcloud_height_buffer:
        type: double
        default_value: 0.2
        description: Height buffer to add above ego height for pointcloud [m]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
      pointcloud_min_height:
        type: double
        default_value: 0.2
        description: Minimum height of pointcloud [m]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
      lateral_margin:
        car:
          type: double
          default_value: 0.1
          description: Lateral margin on top of ego width for car objects [m]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        truck:
          type: double
          default_value: 0.1
          description: Lateral margin on top of ego width for truck objects [m]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        bus:
          type: double
          default_value: 0.1
          description: Lateral margin on top of ego width for bus objects [m]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        trailer:
          type: double
          default_value: 0.1
          description: Lateral margin on top of ego width for trailer objects [m]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        motorcycle:
          type: double
          default_value: 0.1
          description: Lateral margin on top of ego width for motorcycle objects [m]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        bicycle:
          type: double
          default_value: 0.1
          description: Lateral margin on top of ego width for bicycle objects [m]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        pedestrian:
          type: double
          default_value: 0.1
          description: Lateral margin on top of ego width for pedestrian objects [m]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        hazard:
          type: double
          default_value: 0.1
          description: Lateral margin on top of ego width for hazard objects [m]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        structure:
          type: double
          default_value: 0.1
          description: Lateral margin on top of ego width for structure pointcloud [m]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        vegetation:
          type: double
          default_value: 0.1
          description: Lateral margin on top of ego width for vegetation pointcloud [m]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        unknown:
          type: double
          default_value: 0.0
          description: Lateral margin on top of ego width for unknown objects and unclassified pointcloud [m]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false

    rss_params:
      enable:
        type: bool
        default_value: true
        description: Enable the use of RSS parameters for obstacle stop
        read_only: false
      object_decel:
        car:
          type: double
          default_value: 1.6
          description: Deceleration for car type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        truck:
          type: double
          default_value: 1.6
          description: Deceleration for truck type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        bus:
          type: double
          default_value: 1.6
          description: Deceleration for bus type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        trailer:
          type: double
          default_value: 1.6
          description: Deceleration for trailer type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        motorcycle:
          type: double
          default_value: 3.0
          description: Deceleration for motorcycle type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        bicycle:
          type: double
          default_value: 5.0
          description: Deceleration for bicycle type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        pedestrian:
          type: double
          default_value: 5.0
          description: Deceleration for pedestrian type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
        animal:
          type: double
          default_value: 5.0
          description: Deceleration for animal type objects [m/s^2]
          validation:
            bounds<>: [0.0, 10.0]
          read_only: false
      ego_decel:
        type: double
        default_value: 2.0
        description: Deceleration for ego vehicle [m/s^2]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
      safety_margin:
        type: double
        default_value: 1.5
        description: Safety margin to consider for RSS calculation [m]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
      lookahead_horizon:
        type: double
        default_value: 1.5
        description: lookahead horizon for RSS calculation [s]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false

  surround_obstacle_stop:
    use_objects:
      type: bool
      default_value: true
      description: Enable the use of objects for surround obstacle stop
      read_only: false
    use_pointcloud:
      type: bool
      default_value: true
      description: Enable the use of pointcloud for surround obstacle stop
      read_only: false
    target_objects:
      bbox:
        type: string_array
        default_value:
          [car, truck, bus, trailer, motorcycle, bicycle, pedestrian, hazard, animal, unknown]
        description: Types of bounding box shaped objects to consider for surround obstacle stop
        read_only: false
      polygon:
        type: string_array
        default_value: [car, truck, bus, trailer, pedestrian, hazard, animal, unknown]
        description: Types of polygon shaped objects to consider for surround obstacle stop
        read_only: false
      pointcloud:
        type: string_array
        default_value: [structure, vegetation]
        description: Pointcloud types to consider for surround obstacle stop
        read_only: false
    base_distance_th:
      &distance_th_template {
        type: double,
        default_value: 0.5,
        validation: { bounds<>: [0.0, 10.0] },
        read_only: false,
      }
    base:
      &base_template {
        car: *distance_th_template,
        truck: *distance_th_template,
        bus: *distance_th_template,
        trailer: *distance_th_template,
        motorcycle: *distance_th_template,
        bicycle: *distance_th_template,
        pedestrian: *distance_th_template,
        hazard: *distance_th_template,
        animal: *distance_th_template,
        unknown: *distance_th_template,
        pointcloud: *distance_th_template,
      }
    front_distance_th: *base_template
    side_distance_th: *base_template
    back_distance_th: *base_template
    hysteresis_distance:
      type: double
      default_value: 0.1
      description: Distance hysteresis threshold for clearing stop [m]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    hysteresis_time:
      type: double
      default_value: 0.2
      description: Time hysteresis threshold for clearing stop [s]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    pcd_height_buffer:
      type: double
      default_value: 0.5
      description: Height buffer to add above ego height [m]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    pcd_min_height:
      type: double
      default_value: 0.2
      description: Minimum height of pointcloud [m]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
  traffic_light_stop:
    stop_margin:
      type: double
      default_value: 0.75
      description: Distance to maintain from a traffic light when stopped [m]
      validation:
        bounds<>: [0.0, 100.0]
      read_only: false
    stop_for_red_light:
      type: bool
      default_value: true
      description: Enable stopping behavior when red light is detected
      read_only: false
    stop_for_amber_light:
      type: bool
      default_value: false
      description: Enable stopping behavior when amber light is detected
      read_only: false
    treat_amber_light_as_red:
      type: bool
      default_value: false
      description: Treat amber light as red light
      read_only: false
    treat_unknown_light_as_red:
      type: bool
      default_value: true
      description: Treat unknown light as red light
      read_only: false
    enable_arrow_aware_amber_passing:
      type: bool
      default_value: true
      description: Allow passing on amber after Green Circle when on a turn lane with a mapped static arrow
      read_only: false
    overshoot_tolerance:
      type: double
      default_value: 0.5
      description: Tolerance for overshoot [m]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    allow_if_cannot_stop_distance:
      type: double
      default_value: 1.0
      description: allow crossing a stop line within this distance if ego cannot stop before the line plus its margin [m]
      validation:
        bounds<>: [0.0, 100.0]
      read_only: false
    min_lookahead_distance:
      type: double
      default_value: 20.0
      description: Minimum forward trajectory length to scan for traffic light stop lines even at low ego speed [m]
      validation:
        bounds<>: [0.0, 300.0]
      read_only: false
    th_stable_duration_red:
      type: double
      default_value: 0.2
      description: Threshold for stable duration of red light [s]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    th_stable_duration_amber:
      type: double
      default_value: 0.2
      description: Threshold for stable duration of amber light [s]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    th_stable_duration_unknown:
      type: double
      default_value: 0.5
      description: Threshold for stable duration of unknown light [s]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    hold_position_when_stopped:
      type: bool
      default_value: false
      description: When ego is already stopped at red/amber, hold in place instead of inserting a stop point ahead that would pull the vehicle forward
      read_only: false
    hold_position_distance_threshold:
      type: double
      default_value: 2.0
      description: Maximum distance to the target stop point at which a stopped ego holds in place [m]. Farther short-stops are still allowed to pull forward to close the gap
      validation:
        bounds<>: [0.0, 100.0]
      read_only: false
    amber_rejection:
      th_hysteresis:
        type: double
        default_value: 0.5
        description: Threshold for amber rejection hysteresis [s]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
      reject_if_stop_detected:
        type: bool
        default_value: true
        description: Reject if we detect a previous stop attempt from input trajectory
        read_only: false
      can_stop_decel:
        type: double
        default_value: 2.8
        description: Deceleration threshold for ego vehicle to stop [m/s^2]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
      can_stop_jerk:
        type: double
        default_value: 5.0
        description: Jerk threshold for ego vehicle to stop [m/s^3]
        validation:
          bounds<>: [0.0, 100.0]
        read_only: false
      crossing_time_limit:
        type: double
        default_value: 2.75
        description: Crossing time limit [s]
        validation:
          bounds<>: [0.0, 10.0]
        read_only: false
  model_planning_factor_id:
    enable_stop:
      type: bool
      default_value: true
      description: Publish STOP planning factors inferred from the planner trajectory
      read_only: false
    enable_slowdown:
      type: bool
      default_value: false
      description: Publish SLOW_DOWN planning factors inferred from the planner trajectory
      read_only: false
    stop_velocity_threshold:
      type: double
      default_value: 0.1
      description: Velocity at or below which a trajectory point is treated as stopped [m/s]
      read_only: false
      validation:
        bounds<>: [0.0, 10.0]
    stop_keep_duration_threshold:
      type: double
      default_value: 1.0
      description: Minimum duration the trajectory must remain stopped to accept the stop [s]
      read_only: false
      validation:
        bounds<>: [0.0, 10.0]
    slowdown_accel_threshold:
      type: double
      default_value: -0.3
      description: Acceleration below which a slowdown section starts [m/s^2]
      read_only: false
      validation:
        bounds<>: [-10.0, 0.0]
  use_akima_spline_interpolation:
    type: bool
    default_value: false
    description: Enable Akima spline interpolation for trajectory smoothing
    read_only: false
  use_eb_smoother:
    type: bool
    default_value: false
    description: Enable Elastic Band smoother for trajectory smoothing
    read_only: false
  use_qp_smoother:
    type: bool
    default_value: true
    description: Enable QP-based trajectory smoothing with explicit jerk constraints
    read_only: false
  use_trajectory_point_fixer:
    type: bool
    default_value: true
    description: Remove repeated or invalid points, or points that go against the general trajectory direction
    read_only: false
  use_trajectory_extender:
    type: bool
    default_value: false
    description: Enable trajectory extender to extend trajectory backward using ego pose history
    read_only: false
  use_velocity_optimizer:
    type: bool
    default_value: true
    description: Enable velocity profile optimization with jerk filtering and constraint enforcement
    read_only: false
  use_kinematic_feasibility_enforcer:
    type: bool
    default_value: false
    description: Enable kinematic feasibility enforcer plugin (Ackermann + yaw rate constraints)
    read_only: false
  use_mpt_optimizer:
    type: bool
    default_value: false
    description: Enable MPT (Model Predictive Trajectory) optimizer plugin for geometry refinement with adaptive bounds
    read_only: false
  use_temporal_mpt_optimizer:
    type: bool
    default_value: false
    description: Enable Temporal MPT optimizer plugin (acados-based kinematic bicycle MPC for combined geometry and velocity optimization)
    read_only: false
  use_time_sequence_raw_optimizer:
    type: bool
    default_value: false
    description: Enable pose-only time-sequence raw optimizer (road-border shift then acados kinematic bicycle)
    read_only: false
  max_vel:
    type: double
    default_value: 11.1
    description: Default maximum velocity used when no external velocity limit is available [m/s]
    validation:
      bounds<>: [0.0, 100.0]
    read_only: false

  limit:
    max_acc:
      type: double
      default_value: 1.0
      description: Maximum acceleration limit for velocity smoothing [m/s^2]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    min_acc:
      type: double
      default_value: -2.5
      description: Minimum acceleration limit for velocity smoothing [m/s^2]
      validation:
        bounds<>: [-10.0, 0.0]
      read_only: false
    max_jerk:
      type: double
      default_value: 1.5
      description: Maximum jerk limit for velocity smoothing [m/s^3]
      validation:
        bounds<>: [0.0, 100.0]
      read_only: false
    min_jerk:
      type: double
      default_value: -1.5
      description: Minimum jerk limit for velocity smoothing [m/s^3]
      validation:
        bounds<>: [-100.0, 0.0]
      read_only: false

  trajectory_point_fixer:
    remove_close_points:
      type: bool
      default_value: true
      description: Enable removal of close proximity points
      read_only: false
    resample_close_points:
      type: bool
      default_value: true
      description: Enable resampling of close proximity points
      read_only: false
    min_dist_to_remove_m:
      type: double
      default_value: 0.01
      description: Minimum distance threshold for removing close proximity points [m]
      validation:
        bounds<>: [0.0, 1.0]
      read_only: false
    min_dist_to_resample_m:
      type: double
      default_value: 0.05
      description: Minimum distance threshold for merging close proximity points [m]
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false
    stop_detection_velocity_threshold_mps:
      type: double
      default_value: 0.3
      description: "Velocity threshold used by the stop-detection logic: points whose speed falls below this value while decelerating are treated as stop candidates by both the cluster-based and velocity-profile-based detectors [m/s]"
      validation:
        bounds<>: [0.0, 10.0]
      read_only: false

  trajectory_kinematic_feasibility:
    max_yaw_rate_rad_s:
      type: double
      default_value: 0.7
      description: Maximum yaw rate [rad/s].
      validation:
        bounds<>: [0.1, 2.0]
      read_only: false
    time_step_s:
      type: double
      default_value: 0.1
      description: Time step for kinematic feasibility enforcement [s].
      validation:
        bounds<>: [0.01, 1.0]
      read_only: false

  trajectory_mpt_optimizer:
    corridor_width_m:
      type: double
      default_value: 3.5
      description: Base corridor width for adaptive bounds generation [m]. Defines the lateral distance from trajectory centerline to left/right bounds.
      validation:
        bounds<>: [2.0, 10.0]
      read_only: false
    enable_adaptive_width:
      type: bool
      default_value: true
      description: Enable adaptive corridor width based on curvature and velocity. When true, corridor widens in curves and at low speeds.
      read_only: false
    curvature_width_factor:
      type: double
      default_value: 0.5
      description: Factor for curvature-based corridor widening [m/rad]. Higher values provide more space in curves.
      validation:
        bounds<>: [0.0, 2.0]
      read_only: false
    velocity_width_factor:
      type: double
      default_value: 0.3
      description: Factor for velocity-based corridor widening [m]. Higher values provide more maneuvering room at low speeds.
      validation:
        bounds<>: [0.0, 2.0]
      read_only: false
    min_clearance_m:
      type: double
      default_value: 0.5
      description: Minimum clearance from vehicle edges to corridor bounds [m]. Ensures minimum safe distance.
      validation:
        bounds<>: [0.0, 2.0]
      read_only: false
    reset_previous_data_each_iteration:
      type: bool
      default_value: true
      description: Reset MPT's previous optimization data each cycle. Should be true for diffusion planner (new trajectories each cycle), false for incremental planners.
      read_only: false
    enable_debug_info:
      type: bool
      default_value: false
      description: Enable debug visualization markers for bounds and reference trajectory.
      read_only: false
    output_delta_arc_length_m:
      type: double
      default_value: 1.0
      description: Spacing between trajectory points in MPT optimization [m]. Smaller values provide finer resolution but increase computation.
      validation:
        bounds<>: [0.1, 5.0]
      read_only: false
    output_backward_traj_length_m:
      type: double
      default_value: 5.0
      description: Length of trajectory extension backward from ego pose [m].
      validation:
        bounds<>: [0.0, 20.0]
      read_only: false
    ego_nearest_dist_threshold_m:
      type: double
      default_value: 3.0
      description: Distance threshold for finding nearest trajectory point to ego [m].
      validation:
        bounds<>: [0.5, 10.0]
      read_only: false
    ego_nearest_yaw_threshold_deg:
      type: double
      default_value: 45.0
      description: Yaw threshold for finding nearest trajectory point to ego [degrees].
      validation:
        bounds<>: [10.0, 90.0]
      read_only: false
    acceleration_moving_average_window:
      type: int
      default_value: 5
      description: Moving average window size for acceleration smoothing. Larger values produce smoother acceleration but increase lag. Window of 1 = no smoothing.
      validation:
        bounds<>: [1, 20]
      read_only: false

  trajectory_temporal_mpt_optimizer:
    min_points_for_optimization:
      type: int
      default_value: 2
      description: Minimum number of trajectory points required to run temporal MPT optimization.
      validation:
        bounds<>: [2, 1000]
      read_only: false
    acc_time_constant:
      type: double
      default_value: 0.15
      description: First-order acceleration actuator time constant [s].
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    steer_time_constant:
      type: double
      default_value: 0.08
      description: First-order steering actuator time constant [s].
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    max_steer_rate:
      type: double
      default_value: 3.0
      description: Maximum absolute steering rate [rad/s].
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    use_previous_solution_warm_start:
      type: bool
      default_value: true
      description: Warm-start each solve with the previous solution shifted by one stage.
      read_only: false
    enable_debug_info:
      type: bool
      default_value: false
      description: Enable debug logging for temporal MPT solver failures.
      read_only: false
    publish_debug_topics:
      type: bool
      default_value: false
      description: Publish temporal MPT input, output, status, and control debug topics.
      read_only: false
    write_replay_fixture:
      type: bool
      default_value: false
      description: Write replay fixture files when temporal MPT solving fails.
      read_only: false
    replay_fixture_directory:
      type: string
      default_value: ~/.ros/autoware_temporal_mpt_replay
      description: Directory used for temporal MPT replay fixture files.
      read_only: false
    log_replay_fixture_to_console:
      type: bool
      default_value: false
      description: Log temporal MPT replay fixture contents to console when solving fails.
      read_only: false
    reroute_output:
      type: bool
      default_value: false
      description: Apply temporal MPT output to debug topics only, leaving the pipeline trajectory unchanged.
      read_only: false

  time_sequence_raw_optimizer:
    weight_longitudinal:
      type: double
      default_value: 0.5
      description: Tracking weight along the reference heading [1/m^2]
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    weight_lateral:
      type: double
      default_value: 0.5
      description: Tracking weight perpendicular to the reference heading [1/m^2]
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    weight_yaw:
      type: double
      default_value: 0.05
      description: Tracking weight for heading [1/rad^2]
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    weight_jerk:
      type: double
      default_value: 0.1
      description: Regularization weight on jerk input
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    weight_steering_rate:
      type: double
      default_value: 10.0
      description: Regularization weight on steering rate input
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    terminal_weight_scale:
      type: double
      default_value: 2.5
      description: Terminal state weight = scale * stage weight
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    goal:
