        validation:
          bounds<>: [0.0, 10000.0]
        read_only: false
    temporal_consistency:
      enable:
        type: bool
        default_value: true
        description: Add a weak cost that tracks the previous solved plan resampled by timestamp
        read_only: false
      weight_longitudinal:
        type: double
        default_value: 0.004
        description: Temporal consistency weight along the previous heading at t=0 [1/m^2]
        validation:
          bounds<>: [0.0, 10000.0]
        read_only: false
      weight_lateral:
        type: double
        default_value: 0.2
        description: Temporal consistency weight perpendicular to the previous heading at t=0 [1/m^2]
        validation:
          bounds<>: [0.0, 10000.0]
        read_only: false
      weight_yaw:
        type: double
        default_value: 0.002
        description: Temporal consistency heading weight at t=0 [1/rad^2]
        validation:
          bounds<>: [0.0, 10000.0]
        read_only: false
      weight_velocity:
        type: double
        default_value: 0.004
        description: Temporal consistency velocity weight at t=0
        validation:
          bounds<>: [0.0, 10000.0]
        read_only: false
      decay_time_constant_s:
        type: double
        default_value: 1.0
        description: Horizon decay time constant; <= 0 keeps temporal weights uniform [s]
        read_only: false
      far_weight_ratio:
        type: double
        default_value: 0.5
        description: Fraction of temporal weight remaining at the far end of the horizon
        validation:
          bounds<>: [0.0, 1.0]
        read_only: false
    min_velocity_mps:
      type: double
      default_value: 0.0
      description: Lower velocity bound; 0 prevents backward motion [m/s]
      read_only: false
    max_velocity_mps:
      type: double
      default_value: 30.0
      description: Upper velocity bound [m/s]
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    min_acceleration_mps2:
      type: double
      default_value: -4.0
      description: Minimum longitudinal acceleration state bound [m/s^2]
      read_only: false
    max_acceleration_mps2:
      type: double
      default_value: 3.0
      description: Maximum longitudinal acceleration state bound [m/s^2]
      read_only: false
    min_jerk_mps3:
      type: double
      default_value: -5.0
      description: Minimum longitudinal jerk input bound [m/s^3]
      read_only: false
    max_jerk_mps3:
      type: double
      default_value: 5.0
      description: Maximum longitudinal jerk input bound [m/s^3]
      read_only: false
    max_steering_rate_rps:
      type: double
      default_value: 1.0
      description: Maximum absolute steering rate [rad/s]
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    max_lateral_acceleration_mps2:
      type: double
      default_value: 3.0
      description: Soft lateral acceleration constraint bound [m/s^2]
      validation:
        bounds<>: [0.0, 10000.0]
      read_only: false
    max_sqp_iterations:
      type: int
      default_value: 50
      description: Maximum SQP iterations for the acados solver
      validation:
        bounds<>: [0, 10000]
      read_only: false
    publish_debug_topics:
