name: build-test-tidy-pr

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # A PR that modifies no package has nothing to build, so it does not need the label.
  # This runs on a plain runner, without the large CI images.
  # If this job fails, its result is empty, and the label stays required.
  check-if-build-is-needed:
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.check.outputs.result }}
    steps:
      - name: Set PR fetch depth
        run: echo "PR_FETCH_DEPTH=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> "${GITHUB_ENV}"
        shell: bash

      - name: Checkout PR branch and all PR commits
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ env.PR_FETCH_DEPTH }}

      - name: Setup Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      # get-modified-packages needs only `colcon list`.
      - name: Install colcon
        run: pip3 install colcon-core colcon-ros colcon-package-information colcon-package-selection
        shell: bash

      - name: Get modified packages
        id: get-modified-packages
        uses: autowarefoundation/autoware-github-actions/get-modified-packages@v1

      - name: Check if the build is needed
        id: check
        # clang-tidy-differential checks all packages when .clang-tidy-ci changes, and it needs the build first.
        env:
          MODIFIED_PACKAGES: ${{ steps.get-modified-packages.outputs.modified-packages }}
        run: |
          if [ -n "${MODIFIED_PACKAGES}" ] || git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -qx '\.clang-tidy-ci'; then
            echo "result=true" >> "${GITHUB_OUTPUT}"
          else
            echo "result=false" >> "${GITHUB_OUTPUT}"
          fi
        shell: bash

  require-label:
    if: ${{ always() }}
    needs: check-if-build-is-needed
    uses: autowarefoundation/autoware-github-actions/.github/workflows/require-label.yaml@v1
    with:
      label: run:build-and-test-differential
      run-condition: ${{ needs.check-if-build-is-needed.outputs.result != 'false' }}

  check-if-cuda-job-is-needed:
    # The CUDA and clang-tidy jobs run only after this job, so this gates them on the label.
    if: ${{ needs.require-label.outputs.result == 'true' }}
    needs: require-label
    runs-on: ubuntu-latest
    outputs:
      cuda_job_is_needed: ${{ steps.check.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if relevant files changed
        id: check
        uses: step-security/changed-files@v45
        with:
          files: |
            perception/**
            sensing/**
            planning/autoware_diffusion_planner/**

      - name: Output result
        run: |
          echo "CUDA job needed: ${{ steps.check.outputs.any_changed }}"
        shell: bash

  build-and-test-differential:
    if: ${{ always() }}
    needs:
      - require-label
      - check-if-cuda-job-is-needed
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [humble, jazzy]
        include:
          - rosdistro: humble
            container: ghcr.io/autowarefoundation/autoware:universe-dependencies-humble
          - rosdistro: jazzy
            container: ghcr.io/autowarefoundation/autoware:universe-dependencies-jazzy

    uses: ./.github/workflows/build-and-test-differential.yaml
    with:
      rosdistro: ${{ matrix.rosdistro }}
      container: ${{ matrix.container }}
      run-condition: ${{ needs.require-label.outputs.result == 'true' }}
      # The cuda job covers coverage upload when it runs; upload here otherwise.
      upload-coverage: ${{ matrix.rosdistro == 'jazzy' && needs.check-if-cuda-job-is-needed.outputs.cuda_job_is_needed != 'true' }}
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  build-and-test-packages-above-differential:
    if: ${{ always() }}
    needs:
      - require-label
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [humble, jazzy]
        include:
          - rosdistro: humble
            container: ghcr.io/autowarefoundation/autoware:universe-dependencies-humble
          - rosdistro: jazzy
            container: ghcr.io/autowarefoundation/autoware:universe-dependencies-jazzy

    uses: ./.github/workflows/build-and-test-packages-above-differential.yaml
    with:
      rosdistro: ${{ matrix.rosdistro }}
      container: ${{ matrix.container }}
      run-condition: ${{ needs.require-label.outputs.result == 'true' }}
      runner: "['self-hosted', 'Linux', 'X64']"

  build-and-test-differential-cuda:
    if: ${{ always() }}
    needs: check-if-cuda-job-is-needed
    strategy:
      fail-fast: false
      matrix:
        rosdistro: [humble, jazzy]
        include:
          - rosdistro: humble
            container: ghcr.io/autowarefoundation/autoware:universe-dependencies-cuda-humble
          - rosdistro: jazzy
            container: ghcr.io/autowarefoundation/autoware:universe-dependencies-cuda-jazzy

    uses: ./.github/workflows/build-and-test-differential.yaml
    with:
      rosdistro: ${{ matrix.rosdistro }}
      container: ${{ matrix.container }}
      run-condition: ${{ needs.check-if-cuda-job-is-needed.outputs.cuda_job_is_needed == 'true' }}
      runner: "['self-hosted', 'Linux', 'X64']"
      upload-coverage: ${{ matrix.rosdistro == 'jazzy' }}
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  clang-tidy-differential:
    if: ${{ always() }} # always run to provide report for status check
    needs:
      - check-if-cuda-job-is-needed
      - build-and-test-differential
    uses: ./.github/workflows/clang-tidy-differential.yaml
    with:
      run-condition: ${{ needs.check-if-cuda-job-is-needed.outputs.cuda_job_is_needed == 'false' && needs.build-and-test-differential.result == 'success' }}

  clang-tidy-differential-cuda:
    if: ${{ always() }} # always run to provide report for status check
    needs:
      - check-if-cuda-job-is-needed
      - build-and-test-differential-cuda
    uses: ./.github/workflows/clang-tidy-differential.yaml
    with:
      container: ghcr.io/autowarefoundation/autoware:universe-dependencies-cuda-jazzy
      run-condition: ${{ needs.check-if-cuda-job-is-needed.outputs.cuda_job_is_needed == 'true' && needs.build-and-test-differential-cuda.result == 'success' }}
      runner: "['self-hosted', 'Linux', 'X64']"
